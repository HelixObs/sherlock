instrument_id: CHIME
description: "Canadian Hydrogen Intensity Mapping Experiment — FRB detection pipeline"

prometheus:
  node_memory:  node_memory_MemAvailable_bytes
  node_cpu:     rate(node_cpu_seconds_total{mode!="idle"}[5m])
  host_label:   rack_id

pipeline:
  stages:
    - name: x_engine_correlator
      description: "Processes 8-second FPGA data blocks from 1024 inputs"
      known_failures:
        - type: BUFFER_OVERFLOW
          hint: "Check upstream FPGA timing and ring buffer utilization. Usually caused by packet loss."
        - type: TIMESTAMP_MISMATCH
          hint: "GPS timing issue. Check GPS lock status on the correlator nodes."

    - name: frb_classifier
      description: "Scores beam candidates for FRB probability using ML model"
      known_failures:
        - type: CLASSIFIER_TIMEOUT
          hint: "Usually GPU memory pressure on gpu-rack-3. Check node_memory_MemAvailable_bytes first."
        - type: MODEL_LOAD_FAILURE
          hint: "Model weights missing or corrupt. Check /data/models/ on the classifier nodes."

    - name: l2-l3
      description: "Clusters beam candidates into FRB events"
      known_failures:
        - type: INSUFFICIENT_CANDIDATES
          hint: "Fewer than 2 candidates — may be a genuine non-detection or RFI flagging too aggressive."

    - name: hdf5_archiver
      description: "Writes FRB event data to HDF5 files on the archive cluster"
      known_failures:
        - type: DISK_FULL
          hint: "Check /data/archive disk usage. Retention policy may need adjustment."
        - type: WRITE_TIMEOUT
          hint: "Archive NFS mount may be unresponsive. Check archive cluster health."

contacts:
  oncall:     "@frb_tsar"
  escalation: "@frbadmin"

# Notification rules — one block per helix.* event type.
# Credentials are resolved from environment variables at runtime.
# Changes take effect within 30 seconds without restarting the gateway.
notifications:
  slack_webhook_env: "CHIMEFRB_SLACK_WEBHOOK"   # env var name containing the webhook URL
  github_token_env:  "CHIMEFRB_GITHUB_TOKEN"    # env var name containing the PAT

  events:

    helix.error:
      slack:
        channel: "#chime-frb-alerts"
        # webhook_env: "CHIMEFRB_SLACK_ERRORS_WEBHOOK"  # overrides instrument-level webhook
        sample_window_seconds: 600   # at most 1 Slack message per fingerprint per 10 min
        max_per_window: 1            # exceeded → digest sent at end of window
      github:
        repo: "CHIMEFRB/pipeline-issues"
        labels: ["helixobs", "bug"]
        auto_close_after_days: 7
        on_recurrence_after_close: reopen   # or "new_issue"

    # Example: science-class event — different channel, own webhook, Slack only.
    # helix.chimefrb.frb_detected:
    #   message_template: "FRB detected! DM={{.dm}} SNR={{.snr}} beam={{.beam}}"
    #   slack:
    #     channel: "#detections"
    #     webhook_env: "CHIMEFRB_SLACK_DETECTIONS_WEBHOOK"
    #     sample_window_seconds: 60
    #     max_per_window: 100

# AGENT.md files Sherlock fetches from GitHub for architectural context.
# Each entry is a repo; paths defaults to [AGENT.md] if omitted.
agent_docs:
  - repo: https://github.com/HelixObs/mock-telescope
  - repo: https://github.com/HelixObs/client-python
    paths: [AGENT.md, helixobs/AGENT.md]
  - repo: https://github.com/HelixObs/gateway

