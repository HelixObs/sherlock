<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sherlock (local)</title>
<!--
  A no-build local chat UI for testing sherlock's /chat endpoint by hand —
  open this file directly in a browser (file://), no server needed for the
  page itself. Requires the API it's talking to be running with
  SHERLOCK_DEV_CORS=1 (see main.py) — that flag must never be set outside
  your own machine.

  Defaults to http://localhost:8082; override with ?api=http://host:port,
  which is remembered in localStorage for next time.
-->
<style>
  :root {
    --bg: #ffffff;
    --bg-hover: #f8f8f8;
    --text: #1d1c1d;
    --text-muted: #616061;
    --link: #1264a3;
    --divider: #dddddd;
    --badge-bg: #e8e8e8;
    --badge-text: #616061;
    --code-bg: rgba(29, 28, 29, 0.06);
    --page-bg: #f2f2f2;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d21; --bg-hover: #222529; --text: #d1d2d3; --text-muted: #ababad;
      --link: #4db3ff; --divider: #383a3e; --badge-bg: #383a3e; --badge-text: #ababad;
      --code-bg: rgba(255,255,255,0.08); --page-bg: #0f1113; --input-bg: #1a1d21;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1d21; --bg-hover: #222529; --text: #d1d2d3; --text-muted: #ababad;
    --link: #4db3ff; --divider: #383a3e; --badge-bg: #383a3e; --badge-text: #ababad;
    --code-bg: rgba(255,255,255,0.08); --page-bg: #0f1113; --input-bg: #1a1d21;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-hover: #f8f8f8; --text: #1d1c1d; --text-muted: #616061;
    --link: #1264a3; --divider: #dddddd; --badge-bg: #e8e8e8; --badge-text: #616061;
    --code-bg: rgba(29,28,29,0.06); --page-bg: #f2f2f2; --input-bg: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .titlebar {
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--divider);
  }

  .thread {
    flex: 1 1 auto;
    overflow-y: auto;
    background: var(--bg);
  }

  .msg {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid transparent;
  }
  .msg.user { background: transparent; }

  .avatar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  .avatar.bot { background: linear-gradient(135deg, #1264a3, #0b4f82); }
  .avatar.you { background: #6b6b6b; }

  .msg-body { flex: 1 1 auto; min-width: 0; }
  .msg-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
  .msg-name { font-size: 14px; font-weight: 900; }
  .msg-badge {
    font-size: 10px; font-weight: 700; color: var(--badge-text);
    background: var(--badge-bg); padding: 1px 4px; border-radius: 3px;
  }
  .msg-time { font-size: 11px; color: var(--text-muted); }

  .context-line {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted); margin-bottom: 4px;
  }
  .context-line.thinking { font-style: italic; }

  .section { font-size: 15px; line-height: 1.46; }
  .section p { margin: 0 0 8px; }
  .section p:last-child { margin-bottom: 0; }
  .section ul { margin: 4px 0 8px; padding-left: 22px; }
  .section li { margin-bottom: 2px; }
  .section strong { font-weight: 700; }
  .section a { color: var(--link); text-decoration: none; }
  .section a:hover { text-decoration: underline; }
  .section code {
    background: var(--code-bg); padding: 0.5px 4px; border-radius: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
  }

  .composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--divider);
    background: var(--page-bg);
  }
  .composer input {
    flex: 1 1 auto;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--divider);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .composer input:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  .composer button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--link);
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    cursor: pointer;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }

  .token-details {
    margin: 2px 0 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .token-details summary {
    cursor: pointer;
    user-select: none;
  }
  .token-table {
    border-collapse: collapse;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .token-table th, .token-table td {
    padding: 2px 10px 2px 0;
    text-align: left;
  }
  .token-table th {
    font-weight: 700;
    color: var(--text-muted);
  }
  .token-table td.num, .token-table th.num {
    text-align: right;
  }
  .token-total {
    margin-top: 4px;
    font-weight: 700;
  }
  .token-detail-row td {
    padding-bottom: 6px;
  }
  .call-details summary {
    cursor: pointer;
    user-select: none;
    color: var(--link);
  }
  .call-result {
    margin: 4px 0 0;
    padding: 8px;
    max-height: 300px;
    overflow: auto;
    background: var(--code-bg);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar" id="titlebar">Sherlock — local</div>
  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">Ask it anything — each question streams through the real agent loop against the live knowledge base.</div>
  </div>
  <form class="composer" id="composer">
    <input id="input" type="text" placeholder="Ask Sherlock…" autocomplete="off" autofocus>
    <button id="send" type="submit">Ask</button>
  </form>
</div>

<script>
const params = new URLSearchParams(location.search);
const API = params.get("api") || localStorage.getItem("sherlock_chat_api") || "http://localhost:8082";
localStorage.setItem("sherlock_chat_api", API);
document.getElementById("titlebar").textContent = `Sherlock — ${API.replace(/^https?:\/\//, "")}`;

const sessionId = "web-test-" + Math.random().toString(36).slice(2);
const thread = document.getElementById("thread");
const emptyState = document.getElementById("empty-state");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

// Mirrors agent.py's _PRICING — $ per 1M tokens — so per-tool-call cost here
// lines up with what sherlock_usage/the done chunk's cost_usd actually bills.
// Update if agent.py's table changes.
const PRICING = {
  "claude-sonnet-4-6":         [3.00, 15.00],
  "claude-opus-4-7":           [15.00, 75.00],
  "claude-haiku-4-5-20251001": [0.80, 4.00],
};
const DEFAULT_PRICING = [3.00, 15.00];

function estimateCost(model, tokensIn, tokensOut) {
  const [inRate, outRate] = PRICING[model] || DEFAULT_PRICING;
  return (tokensIn * inRate + tokensOut * outRate) / 1_000_000;
}

const TOOL_LABELS = {
  search_kb: "knowledge base",
  query_entity_events: "entity events",
  query_entity_operations: "entity operations",
  query_entity_ancestors: "provenance",
  query_similar_errors: "similar errors",
  get_logs: "logs", search_logs: "logs",
  get_metrics: "metrics", query_prometheus: "metrics",
  fetch_github_file: "GitHub", fetch_github_blame: "GitHub",
  fetch_github_file_history: "GitHub", search_github_callers: "GitHub",
};

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Minimal GFM -> HTML: same source syntax bot.py converts to Slack mrkdwn
// (**bold**, [text](url), `code`), converted to real tags here instead.
function renderMarkdown(text) {
  const paragraphs = text.split(/\n\n+/);
  return paragraphs.map(p => {
    const lines = p.split("\n");
    const isList = lines.every(l => l.trim().startsWith("- ") || l.trim() === "");
    if (isList) {
      const items = lines.filter(l => l.trim()).map(l => `<li>${inline(l.trim().slice(2))}</li>`).join("");
      return `<ul>${items}</ul>`;
    }
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}

function inline(s) {
  s = escapeHtml(s);
  s = s.replace(/\[([^\]]+)\]\((\S+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}

function timestamp() {
  return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function addUserMessage(text) {
  emptyState.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `
    <div class="avatar you">Y</div>
    <div class="msg-body">
      <div class="msg-header"><span class="msg-name">You</span><span class="msg-time">${timestamp()}</span></div>
      <div class="section"><p>${escapeHtml(text)}</p></div>
    </div>`;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

function addBotPlaceholder() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `
    <div class="avatar bot">S</div>
    <div class="msg-body">
      <div class="msg-header"><span class="msg-name">Sherlock</span><span class="msg-badge">APP</span><span class="msg-time">${timestamp()}</span></div>
      <div class="context-line thinking">Thinking…</div>
      <div class="section"></div>
    </div>`;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

function finalizeBotMessage(el, contextText, html, breakdownHtml) {
  const ctx = el.querySelector(".context-line");
  if (contextText) {
    ctx.textContent = "";
    ctx.innerHTML = `<span>🔍</span><span>Checked: ${escapeHtml(contextText)}</span>`;
    ctx.classList.remove("thinking");
  } else {
    ctx.remove();
  }
  if (breakdownHtml) {
    const div = document.createElement("div");
    div.className = "token-breakdown";
    div.innerHTML = breakdownHtml;
    el.querySelector(".msg-body").insertBefore(div, el.querySelector(".section"));
  }
  el.querySelector(".section").innerHTML = html;
  thread.scrollTop = thread.scrollHeight;
}

function summarizeArgs(args) {
  if (!args || !Object.keys(args).length) return "";
  if (typeof args.query === "string") return args.query;
  return Object.entries(args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
}

// One row per tool call, each showing the *whole turn's* token usage (not a
// marginal per-tool cost — see agent.py's turn_tokens_input comment): a turn
// that decides to call a tool resends the full history so far, so the
// number to watch is how much it grows call over call as history builds.
// Each row's own <details> holds the exact query and raw result returned —
// the actual thing driving that turn's input size, not just its byte count.
function renderTokenBreakdown(calls, totalCostUsd) {
  if (!calls.length) return "";
  const rows = calls.map((c, i) => {
    const resultJson = JSON.stringify(c.result ?? null, null, 2);
    return `
    <tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(TOOL_LABELS[c.tool] || c.tool)}</td>
      <td class="num">${c.tokensIn.toLocaleString()}</td>
      <td class="num">${c.tokensOut.toLocaleString()}</td>
      <td class="num">$${c.cost.toFixed(4)}</td>
    </tr>
    <tr class="token-detail-row">
      <td></td>
      <td colspan="4">
        <details class="call-details">
          <summary>${escapeHtml(summarizeArgs(c.args)) || "(no args)"} — view fetched content</summary>
          <pre class="call-result">${escapeHtml(resultJson)}</pre>
        </details>
      </td>
    </tr>`;
  }).join("");
  const totalLine = totalCostUsd != null
    ? `<div class="token-total">Total: $${totalCostUsd.toFixed(4)}</div>`
    : "";
  return `
    <details class="token-details">
      <summary>Token usage by call (${calls.length})</summary>
      <table class="token-table">
        <thead><tr><th>#</th><th>Tool</th><th class="num">In</th><th class="num">Out</th><th class="num">Est. cost</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${totalLine}
    </details>`;
}

// Mirrors bot.py's _stream_to_slack chunk handling: skip the session_id
// step, skip raw "→ tool(...)" announcement steps (evidence chunks cover
// that as a "Checked: ..." summary instead), accumulate real narration,
// prefer a hypothesis/question/error chunk's text as the final answer.
async function ask(message) {
  addUserMessage(message);
  const placeholder = addBotPlaceholder();
  input.value = "";
  sendBtn.disabled = true;

  try {
    const resp = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId, interface: "web" }),
    });
    const text = await resp.text();
    const narration = [];
    const toolsCalled = [];
    const tokenCalls = [];
    let finalText = "";
    let model = "";
    let totalCostUsd = null;

    for (const line of text.split("\n")) {
      if (!line.trim()) continue;
      const chunk = JSON.parse(line);
      const data = chunk.data || {};
      if (chunk.type === "step" && chunk.text) {
        if ("session_id" in data) continue;
        if (chunk.text.trimStart().startsWith("→")) continue;
        narration.push(chunk.text);
      } else if (chunk.type === "evidence") {
        if (data.tool) toolsCalled.push(data.tool);
        if (data.tool && typeof data.turn_tokens_input === "number") {
          tokenCalls.push({
            tool: data.tool,
            args: data.args || {},
            result: data.result,
            tokensIn: data.turn_tokens_input,
            tokensOut: data.turn_tokens_output || 0,
          });
        }
      } else if (chunk.type === "question" || chunk.type === "error") {
        finalText = chunk.text || "";
      } else if (chunk.type === "hypothesis") {
        const d = chunk.data || {};
        finalText = `**${d.classification || "unknown"}** (${d.confidence || "low"} confidence)\n\n${d.summary || ""}` +
                    (d.recommendation ? `\n\n**Recommendation:** ${d.recommendation}` : "");
      } else if (chunk.type === "done") {
        model = data.model || "";
        totalCostUsd = typeof data.cost_usd === "number" ? data.cost_usd : null;
      }
    }
    if (!finalText) finalText = narration.join("").trim() || "(no response)";

    const checked = [...new Set(toolsCalled.map(t => TOOL_LABELS[t] || t))].join(", ");
    const calls = tokenCalls.map(c => ({ ...c, cost: estimateCost(model, c.tokensIn, c.tokensOut) }));
    finalizeBotMessage(placeholder, checked, renderMarkdown(finalText), renderTokenBreakdown(calls, totalCostUsd));
  } catch (err) {
    finalizeBotMessage(placeholder, "", `<p style="color:#c0392b">Request failed: ${escapeHtml(String(err))} — is the local server running, and started with SHERLOCK_DEV_CORS=1?</p>`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (msg) ask(msg);
});
</script>
</body>
</html>
