[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock"
version = "0.1.0"
description = "Sherlock — AI troubleshooting agent for HelixObs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.30",
    "asyncpg>=0.29",
    "prometheus-client>=0.20",
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
]

[project.scripts]
bot = "sherlock.bot:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sherlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
